<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <div class="container">
      <div class="profile-card">
        <img
          class="profile-image"
          src="assets/images/avatar-jessica.jpeg"
          alt="Profile Image"
        />
        <h1 class="profile-name">Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
        <p class="description">"Front-end developer and avid reader."</p>

        <div class="social-links">
          <a href="https://github.com/martinjv9" class="button-link">
            GitHub
          </a>
          <a
            href="https://www.frontendmentor.io/profile/martinjv9"
            class="button-link"
          >
            Frontend Mentor
          </a>
          <a
            href="https://www.linkedin.com/in/martin-jimenez-702b14257/"
            class="button-link"
          >
            LinkedIn
          </a>
          <a href="https://www.x.com" class="button-link">Twitter</a>
          <a href="https://www.instagram.com" class="button-link">
            Instagram
          </a>
        </div>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Martin Jimenez</a>.
    </footer>
  </body>
</html>
